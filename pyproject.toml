[project]
name = "evalite"
version = "0.1.0"
description = "A lightweight, model-agnostic agent evaluation framework"
readme = "README.md"
license = "MIT"
authors = [{ name = "Yuvraj Singh", email = "uniqueyuvi2111@gmail.com" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic>=2.4",
    "pyyaml>=6.0",
    "typer>=0.13",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/githyuvi/evalite"
Repository = "https://github.com/githyuvi/evalite"

[project.scripts]
evalite = "evalite.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
python_classes = ["NoMatchForAnyClass_*"]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
storage = ["aiosqlite>=0.20", "sqlalchemy[asyncio]>=2.0", "alembic>=1.13"]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "aiosqlite>=0.20", "sqlalchemy[asyncio]>=2.0"]
semantic = ["sentence-transformers>=2.3"]
litellm = ["litellm>=1.0"]
server = ["fastapi>=0.111", "uvicorn>=0.29", "websockets>=12.0"]
