[project]
name = "evalite"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
evalite = "evalite.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
python_classes = ["NoMatchForAnyClass_*"]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
storage = ["aiosqlite>=0.20", "sqlalchemy[asyncio]>=2.0", "alembic>=1.13"]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "aiosqlite>=0.20", "sqlalchemy[asyncio]>=2.0"]
