[project]
name = "evalite-ui"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Paths are relative to this pyproject.toml's directory (evalite_ui/ is the
# build root here, not the repo root), so this packages ./dist/** and
# ./*.py — i.e. evalite_ui/dist/** and evalite_ui/*.py from the repo root.
# (The plan's original "evalite_ui/dist/**" / "evalite_ui/*.py" form was
# written for a root-level pyproject_ui.toml and was verified here to
# produce an empty wheel when the file lives inside evalite_ui/ itself —
# see task report.)
include = ["dist/**", "*.py"]
# dist/ is gitignored (it's `npm run build` output), and hatchling's default
# file selection follows VCS ignore rules, so it must be declared as a
# build artifact to be picked up despite being gitignored.
artifacts = ["dist/**"]

[tool.hatch.build.targets.wheel.sources]
# Without this, hatchling drops __init__.py/server.py/dist/ at the wheel
# root instead of nesting them under an `evalite_ui/` package directory,
# which breaks `import evalite_ui` for a non-editable install. Verified
# with `python -m build --wheel` — see task report.
"" = "evalite_ui"
